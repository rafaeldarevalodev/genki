# Genki 2.0 — Docker Compose
services:
  genki-db:
    build:
      context: ./services/genki-db
      dockerfile: Dockerfile
    volumes:
      - genki-db-data:/var/lib/genki
    networks:
      - genki-net
    healthcheck:
      test: ["CMD", "sqlite3", "/var/lib/genki/genki.db", "SELECT 1;"]
      interval: 10s
      timeout: 5s
      retries: 3

  genki-redis:
    image: redis:7-alpine
    networks:
      - genki-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  genki-vector:
    image: qdrant/qdrant:v1.7.4
    volumes:
      - genki-qdrant:/qdrant/storage
    networks:
      - genki-net
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  genki-llm:
    build:
      context: ./services/genki-llm
      dockerfile: Dockerfile
    volumes:
      - genki-model-cache:/root/.ollama
    networks:
      - genki-net
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  genki-kokoro:
    build:
      context: ./services/genki-kokoro
      dockerfile: Dockerfile
    networks:
      - genki-net
    ports:
      - "5001:5001"
    volumes:
      - genki-model-cache:/root/.cache/kokoro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  genki-whisper:
    build:
      context: ./services/genki-whisper
      dockerfile: Dockerfile
    networks:
      - genki-net
    ports:
      - "8001:8001"
    volumes:
      - genki-model-cache:/root/.cache/whisper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  genki-voice:
    build:
      context: ./services/genki-voice
      dockerfile: Dockerfile
    volumes:
      - genki-model-cache:/model_cache
      - genki-ipc:/tmp/genki/ipc
    networks:
      - genki-net
    ports:
      - "8092:8092"
    depends_on:
      genki-llm:
        condition: service_healthy
      genki-kokoro:
        condition: service_healthy
      genki-whisper:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://genki-redis:6379
      - KOKORO_URL=http://genki-kokoro:5001
      - WHISPER_URL=http://genki-whisper:8001

  genki-api:
    build:
      context: ./services/genki-api
      dockerfile: Dockerfile
    volumes:
      - genki-ipc:/tmp/genki/ipc
    networks:
      - genki-net
    ports:
      - "8000:8090"
    depends_on:
      genki-voice:
        condition: service_healthy
      genki-llm:
        condition: service_healthy
      genki-vector:
        condition: service_healthy
      genki-db:
        condition: service_healthy
      genki-redis:
        condition: service_healthy
      genki-kokoro:
        condition: service_healthy
      genki-whisper:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://genki-redis:6379
      - KOKORO_URL=http://genki-kokoro:5001
      - WHISPER_URL=http://genki-whisper:8001

networks:
  genki-net:
    driver: bridge

volumes:
  genki-db-data:
  genki-qdrant:
  genki-model-cache:
  genki-ipc: